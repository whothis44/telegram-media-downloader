<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archive — Telegram Media Downloader</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#5d6670;--line:#d9dde3;--soft:#f3f5f7;--accent:#2481cc;--accent-fg:#fff;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e}
@media (prefers-color-scheme:dark){:root{--bg:#17212b;--fg:#e7edf3;--muted:#9aa7b4;--line:#2b3a49;--soft:#1f2c3a;--accent:#5eaaf0;--accent-fg:#0d1620;--ok:#4cc26a;--warn:#e3b341;--bad:#ff7b72}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1200px;margin:0 auto;padding:12px 16px 40px}a{color:var(--accent)}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:12px}
header.top h1{font-size:19px;margin:0}.grow{flex:1}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.status{padding:10px 12px;border-radius:10px;background:var(--soft);margin:0 0 12px}.status.bad{border:1px solid var(--bad)}.status.warn{border:1px solid var(--warn)}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.card h2{font-size:16px;margin:0}
.fin{font:inherit;font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}.fin:hover{border-color:var(--accent);color:var(--accent)}.fin.on{border-color:var(--ok);color:var(--ok)}
.muted{color:var(--muted);font-size:13px}.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--bg)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button.b{border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:13.5px;cursor:pointer}
button.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}button.b:disabled{opacity:.5;cursor:default}
button.mini{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;text-decoration:underline}button.mini:disabled{opacity:.5;cursor:default}
input.t,select.t{padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--soft);color:var(--fg);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--soft);color:var(--fg);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip span{color:var(--muted);margin-left:2px}.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.chip.on span{color:var(--accent-fg)}
.sticky{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.rows{border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;align-items:center;padding:7px 10px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row.sel{background:var(--soft)}
.row label{display:flex;gap:8px;align-items:center;cursor:pointer;min-width:0;word-break:break-word}
.row .cat{display:flex;gap:6px;align-items:center}.row .cat input{flex:1;min-width:0}
@media (max-width:700px){.row{grid-template-columns:1fr}}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.done{color:var(--ok);border-color:var(--ok)}.pill.failed{color:var(--bad);border-color:var(--bad)}.pill.running{color:var(--accent);border-color:var(--accent)}
.hit{border-bottom:1px solid var(--line);padding:8px 2px}.hit mark{background:#ffe58a;color:#000;border-radius:2px}
.list{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.log{white-space:pre-wrap;font-size:12.5px}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script>
(() => {
'use strict';
const $app = document.getElementById('app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const NONE = ' none', UNSAVED = ' unsaved';
const fmtNum = (n) => Number(n || 0).toLocaleString('en-CA');
const fmtTime = (ms) => (ms ? new Date(ms).toLocaleString('en-CA', { dateStyle: 'medium', timeStyle: 'short' }) : '');
const fmtDate = (s) => (s ? new Date(s * 1000).toLocaleDateString('en-CA') : '');
const suggestName = (name) => { const m = String(name || '').trim().match(/^(.*?)[\s._-]*\d+$/); return m && m[1].trim() ? m[1].trim() : ''; };
// A suggestion from the name (sports-3 → sports), or else from what the group posts.
const suggestG = (g) => suggestName(g.name) || g.contentSuggest || '';
const suggestWhy = (g) => suggestName(g.name) ? 'from its name' : g.contentSuggest ? `shares ${Math.round((g.contentShare || 0) * 100)}% of its pictures and videos with ${g.contentSuggest}` : '';
const natural = (a, b) => String(a).localeCompare(String(b), undefined, { sensitivity: 'base', numeric: true });

async function api(method, url, body) {
  const init = { method, credentials: 'same-origin', headers: {} };
  if (body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
  try {
    const r = await fetch(url, init);
    let data = null;
    try { data = await r.json(); } catch { /* not JSON */ }
    if (r.status === 401) { location.href = '/login.html'; }
    return { ok: r.ok, status: r.status, data };
  } catch (e) { return { ok: false, status: 0, data: { error: String(e) } }; }
}
const errText = (r) => (r.data && r.data.error) || ('HTTP ' + r.status);

const state = {
  tab: (location.hash || '#overview').slice(1),
  status: null, error: '',
  // categories
  draft: new Map(), sel: new Set(), bulk: '', search: '', filter: '', saving: false, msg: '',
  // rescan
  pick: new Set(), pickOnly: false, pickSearch: '', ensureFilters: true, dialogs: null, dialogsLoading: false, showAll: false,
  // search
  q: '', qCategory: '', hits: null, searching: false, qMore: false, qMode: '',
};

async function load() {
  const r = await api('GET', '/api/ix/status');
  if (r.ok) {
    state.status = r.data; state.error = '';
  } else state.error = 'Could not load: ' + errText(r);
  render();
}

function groups() { return ((state.status && state.status.groups) || []).filter((g) => g.configured).sort((a, b) => natural(a.name, b.name)); }
function catOf(g) { return state.draft.has(g.id) ? state.draft.get(g.id) : (g.category || ''); }
function changed() { return groups().filter((g) => state.draft.has(g.id) && state.draft.get(g.id).trim() !== (g.category || '')); }

function banner() {
  const s = state.status;
  if (!s) return '';
  let h = '';
  const acct = s.account || {};
  const fz = s.freeze || {};
  if (fz.until) {
    const days = Math.max(0, Math.floor((fz.until * 1000 - Date.now()) / 86400000));
    h += `<div class="status bad"><b>Telegram will delete this account on ${esc(new Date(fz.until * 1000).toLocaleString())} — ${days} day(s) left</b> unless an appeal is accepted${fz.appealUrl ? ` (<a href="${esc(fz.appealUrl)}" target="_blank" rel="noopener">appeal</a>)` : ''}. Rescans now take private chats before public ones. <b>Never log this account out of the app:</b> a frozen account cannot sign in again. <button class="mini" data-act="freeze-check">Check again</button></div>`;
  } else if (fz.since) h += `<div class="status warn"><b>Telegram lists this account as frozen since ${esc(new Date(fz.since * 1000).toLocaleString())}</b>, with no deletion date given. <button class="mini" data-act="freeze-check">Check again</button></div>`;
  if (acct.deactivated) h += `<div class="status bad"><b>Telegram reports this account is logged out or deactivated</b> (${esc(acct.lastError)}). Rescans are paused.</div>`;
  else if (acct.frozen) h += `<div class="status warn"><b>Telegram reports this account is frozen</b> (${esc(acct.lastError)}). Rescans keep going for as long as Telegram still lets the account read history${s.settings && s.settings.pauseOnFreeze ? ' — except that you chose to pause them on a freeze (Settings)' : ''}. Messages saved here stay saved even if the account is later deleted.</div>`;
  else if (acct.floodWait) h += `<div class="status"><b>Telegram asked the app to slow down</b> (${esc(acct.lastError)}). The app waits as asked; nothing to do.</div>`;
  if (s.hold && (!acct.deactivated)) h += `<div class="status warn">${esc(s.hold)}</div>`;
  return h;
}

// ---------------- Overview ----------------
function viewDeadline() {
  const d = state.status.deadline; if (!d) return '';
  const days = (sec) => (sec / 86400).toFixed(1);
  const left = d.until ? (d.until - Date.now() / 1000) : 0;
  const rate = (b) => b > 0 ? fmtSize(b * 86400) + '/day' : '—';
  let verdict = '';
  if (!d.leftFiles && !d.toGetFiles) verdict = '<span class="ok">Nothing left to download.</span>';
  else if (!d.etaSec) verdict = '<span class="muted">Speed not known yet (no download finished in the last day).</span>';
  else verdict = `At the last day's speed that takes about <b>${days(d.etaSec)} days</b>.` + (d.until ? (d.finishes === 'yes' ? ' <span class="ok">That is before the deletion date.</span>' : ' <span class="bad">That is after the deletion date.</span>') : '');
  const deferred = (d.deferred || []).reduce((a, b) => a + b, 0);
  let h = `<div class="card"><h2>Before the deadline</h2>
<div>${d.until ? `Telegram deletes this account in <b>${days(Math.max(0, left))} days</b>. ` : 'Telegram has not set a deletion date. '}<b>${fmtNum(d.toGetFiles || d.leftFiles)}</b> distinct file(s), <b>${fmtSize(d.toGetBytes || d.leftBytes)}</b>, still to download${d.copies ? ` (${fmtNum(d.copies)} more are copies of these or of saved files: they come free)` : ''}; ${fmtNum(d.leftFiles)} of them are in the download queue now${d.unscanned ? `, the rest come as the ${fmtNum(d.unscanned)} group(s) still waiting for their rescan are reached` : ''}. ${verdict}</div>
<div class="muted">Speed: ${rate(d.rate24h)} over the last day, ${rate(d.rate1h)} over the last hour (files covered by a saved copy not counted).${d.active ? ` <b>Smaller files are going first</b>${deferred ? ` (${fmtNum(deferred)} larger file(s) set aside for now)` : ''}.` : d.mode === 'off' ? ' Order: normal (Settings).' : ''}</div>
<div class="btns"><button class="b" data-act="dl-loss">${state.loss ? 'Refresh' : 'Show'} what would be lost today</button></div>`;
  const L = state.loss;
  if (L && L.error) h += `<div class="bad">${esc(L.error)}</div>`;
  else if (L && L.loss) {
    h += L.loss.length ? `<div class="muted">Private chats first: they cannot be read again from another account. Then chats not fully scanned, then the most data.</div><div class="list"><table><tr><th>Chat</th><th></th><th class="n">Files left</th><th class="n">Size</th><th>Messages</th></tr>${L.loss.map((x) => `<tr><td>${esc(x.name)}</td><td>${x.private ? '<span class="warn">private</span>' : '<span class="muted">public</span>'}</td><td class="n">${fmtNum(x.files)}</td><td class="n">${fmtSize(x.bytes)}</td><td>${x.scanned ? '<span class="ok">all read</span>' : '<span class="warn">not all read yet</span>'}</td></tr>`).join('')}</table></div>` : '<div class="ok">Nothing would be lost: every chat is fully read and downloaded.</div>';
  }
  return h + '</div>';
}

function viewOverview() {
  const s = state.status;
  const gs = (s.groups || []).slice().sort((a, b) => natural(a.name, b.name));
  const total = gs.reduce((n, g) => n + g.messages, 0);
  const notYet = gs.filter((g) => !g.lastWalk).length;
  const ex = s.export || {};
  let h = `<div class="card"><h2>Your index</h2>
<div class="btns"><a class="b" style="text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);font-weight:600" href="/ix/view/" target="_blank">Open the index</a>
<a class="b" style="text-decoration:none;padding:7px 12px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);font-weight:600" href="/ix/browse" target="_blank">Open the media browser</a>
<button class="b" data-act="export" ${ex.running ? 'disabled' : ''}>${ex.running ? 'Writing…' : 'Write the index to the NAS now'}</button></div>
<div class="muted">The index opens here in the dashboard, always up to date. A copy is also written to <code>${esc(s.exportDir || '?')}</code> ${s.settings.exportEnabled ? 'every night at ' + esc(s.settings.exportTime) : '(nightly copy turned off in Settings)'}, so you can open <code>index.html</code> there without the app. Its <code>data</code> folder holds everything in plain files for other tools (every message with its full Telegram record, albums, files with checksums, duplicates; see <code>data/README.md</code>).${s.exportDirError ? ` <span class="bad">${esc(s.exportDirError)}</span>` : ''}</div>
${ex.running ? `<div class="muted">${esc(ex.progress || 'Working…')}</div>` : ''}
${ex.finishedAt && !ex.running ? `<div class="muted">Last written ${esc(fmtTime(ex.finishedAt))}${ex.error ? ` — <span class="bad">failed: ${esc(ex.error)}</span>` : ` (${fmtNum(ex.files)} files)`}.</div>` : ''}
</div>`;
  h += viewDeadline();
  h += viewDownloads();
  h += viewKeeping();
  h += `<div class="card"><h2>Messages captured</h2><div class="muted">${fmtNum(total)} messages saved across ${gs.length} group(s). ${notYet ? `<b>${notYet} group(s) have not had a full rescan yet</b> — use the Rescan tab to capture their history.` : 'Every group has had a full rescan.'} New posts are saved as the monitor sees them.</div>
<div class="btns"><button class="b" data-act="g-finish-complete" ${gs.some((g) => !g.finishedAt && g.tgCount && g.lastWalk && g.tgCount - (g.messages - g.deleted) <= 0) ? '' : 'disabled'} title="Every group marked ✓ complete is set to finished; rescans then leave it alone">✓ Finish all complete groups</button><span class="muted">Finished groups are skipped by every rescan. To finish or reopen several at once, tick them in Rescan → Choose groups.</span></div>
<div class="muted">Complete: every message Telegram says the group holds has been saved, checked at each rescan. Groups rescanned before version ix.5 may show a few short: system notices (pins, renames) are only saved from ix.5 on; a new rescan fills them in.</div>
<div class="list"><table><tr><th>Group</th><th>Category</th><th>Messages saved</th><th>Telegram says</th><th>Complete?</th><th>Finished</th><th>Deleted on Telegram</th><th>Files</th><th>Dates</th><th>Last full rescan</th></tr>`;
  for (const g of gs) {
    const saved = g.messages - g.deleted;
    const short = g.tgCount ? g.tgCount - saved : null;
    const complete = short === null ? '<span class="muted" title="Telegram\'s count is read at the next rescan">not checked yet</span>'
      : short <= 0 ? (g.lastWalk ? '<span class="ok">✓ complete</span>' : '<span class="muted">all seen so far</span>')
      : `<span class="warn">${fmtNum(short)} short</span>`;
    const ids = g.maxId ? `<div class="muted" title="Every message number from 1 to the newest is either saved here or confirmed gone on Telegram (checked at the end of each messages pass)">IDs 1–${fmtNum(g.maxId)}: ${fmtNum(Math.min(g.maxId, g.messages + g.gone))} accounted for${g.maxId - g.messages - g.gone > 0 ? `, <span class="warn">${fmtNum(g.maxId - g.messages - g.gone)} unchecked</span>` : ''}</div>` : '';
    const link = g.username ? `<div class="muted"><a href="https://t.me/${esc(g.username)}" target="_blank" rel="noopener">t.me/${esc(g.username)}</a></div>` : g.invite ? `<div class="muted" title="Invite link">${esc(g.invite)}</div>` : '';
    h += `<tr><td><a href="/ix/view/${esc(g.dir)}/index.html" target="_blank">${esc(g.name)}</a>${link}${g.about ? `<div class="muted" style="max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(g.about)}">${esc(g.about)}</div>` : ''}</td><td>${esc(g.category || '')}</td><td class="n">${g.messages ? fmtNum(g.messages) : '<span class="warn">none yet</span>'}${g.comments ? `<div class="muted">+${fmtNum(g.comments)} comments</div>` : ''}</td><td class="n">${g.tgCount ? fmtNum(g.tgCount) : '<span class="muted">–</span>'}</td><td>${complete}${ids}</td><td>${g.finishedAt ? `<button class="fin on" data-act="g-open" data-id="${esc(g.id)}" title="Finished ${esc(fmtDate(Math.floor(g.finishedAt / 1000)))}: rescans leave it alone. Click to reopen.">✓ Finished</button>` : `<button class="fin" data-act="g-finish" data-id="${esc(g.id)}" title="Mark finished: rescans will leave it alone">Finish</button>`}</td><td class="n">${fmtNum(g.deleted)}</td><td class="n">${fmtNum(g.files)}</td><td class="muted">${esc(fmtDate(g.firstDate))}${g.firstDate ? ' – ' : ''}${esc(fmtDate(g.lastDate))}</td><td>${g.lastWalk ? esc(fmtTime(g.lastWalk)) : '<span class="warn">never</span>'}</td></tr>`;
  }
  h += `</table></div></div>`;
  return h;
}

function viewKeeping() {
  const s = state.status, hd = s.held || {}, fx = s.fixity || {}, pic = s.pictures || {}, vd = s.dups || {};
  const pct = (a, b) => b ? Math.floor((100 * a) / b) + '%' : '—';
  return `<div class="card"><h2>Copies, duplicates and integrity</h2>
<div><b>Not downloaded because they are copies:</b> ${fmtNum(hd.subst || 0)} exact re-upload(s) (${fmtNum(hd.savedMb || 0)} MB saved; the bytes were checked on Telegram) · ${fmtNum(hd.held || 0)} likely copies held at the back of the queue${s.settings.holdForever ? ' (kept held: Settings)' : ' until nothing else is waiting'}.</div>
<div class="btns"><button class="b" data-act="held-release" ${hd.held ? '' : 'disabled'}>Download the held files now</button><button class="b" data-act="subst-fetch" ${hd.subst ? '' : 'disabled'}>Fetch the real files of re-uploads</button>${state.keepMsg ? `<span class="muted">${esc(state.keepMsg)}</span>` : ''}</div>
<div class="muted">Every message is archived in full either way, so any of these files can be fetched later.</div>
<div style="margin-top:6px"><b>Duplicate finding:</b> pictures ${fmtNum(pic.done || 0)} of ${fmtNum(pic.total || 0)} (${pct(pic.done || 0, pic.total)}), ${fmtNum(pic.grouped || 0)} grouped with a look-alike, ${fmtNum(pic.suggested || 0)} to review · videos ${fmtNum(vd.done || 0)} of ${fmtNum(vd.total || 0)} (${pct(vd.done || 0, vd.total)}). Runs on this PC from the files on the NAS; it never uses Telegram.</div>
<div style="margin-top:6px"><b>Integrity check:</b> ${fmtNum(fx.checked || 0)} of ${fmtNum(fx.files || 0)} stored files re-read this month (every file is re-read about once a month and its fingerprint compared)${fx.changed ? ` · <span class="bad">${fmtNum(fx.changed)} changed</span>` : ''}${fx.missing ? ` · <span class="bad">${fmtNum(fx.missing)} missing</span>` : ''}${fx.sizeOff ? ` · <span class="warn">${fmtNum(fx.sizeOff)} not the size Telegram gave</span>` : ''}${!fx.changed && !fx.missing && fx.checked ? ' · <span class="ok">no problems</span>' : ''}.</div>
</div>`;
}

function viewDownloads() {
  const d = state.status.downloads;
  if (!d) return '';
  let state1;
  if (!d.engineRunning) state1 = `<span class="warn"><b>The download engine is not running</b>, so nothing is downloading. Start the monitor on the dashboard.</span>`;
  else if (d.queuePaused) state1 = `<span class="warn"><b>The download queue is paused</b> on the dashboard, so nothing is downloading.</span>`;
  else if (d.downloading || d.lastHour) state1 = `<b>Downloading.</b> ${fmtNum(d.lastHour)} file(s) finished in the last hour${d.lastAt ? ' (latest: ' + esc(fmtTime(d.lastAt)) + ')' : ''}.`;
  else if (d.waiting) state1 = `<span class="warn">${fmtNum(d.waiting)} file(s) waiting, but none finished in the last hour.</span> Telegram may have asked the app to slow down; if this lasts, check the dashboard's queue.`;
  else state1 = `Nothing to download right now${d.lastAt ? ' — the latest file finished ' + esc(fmtTime(d.lastAt)) : ''}.`;
  let h = `<div class="card"><h2>Downloads</h2><div>${state1}</div>
<div class="muted" style="margin-top:6px">${fmtNum(d.downloading)} downloading · ${fmtNum(d.waiting)} waiting · <span class="${d.failed ? 'bad' : ''}">${fmtNum(d.failed)} failed</span>${d.givenUp ? ` (${fmtNum(d.givenUp)} no longer retried automatically)` : ''}</div>
${(() => {
  const p = d.pace || {}; const mbs = (b) => (b / 1e6).toFixed(b >= 1e7 ? 0 : 1) + ' MB/s';
  let x = '';
  if (d.engineRunning && (p.dcs || []).length) {
    x += `<div style="margin-top:6px">Speed: <b>${mbs(p.speed5m || 0)}</b> over the last 5 minutes (${mbs(p.speed || 0)} now). The app is allowed ${fmtNum(p.window)} file part(s) of 1 MB in flight at once and finds that number by measuring: more while it makes downloads faster, fewer as soon as Telegram asks it to wait${p.floods1h ? ` (it asked ${fmtNum(p.floods1h)} time(s) in the last hour)` : ''}.</div>`;
    x += `<div class="muted">${p.dcs.map((c) => `Telegram server ${c.dc}${c.account ? ' (' + esc(c.account) + ')' : ''}: ${c.window} at once, ${mbs(c.speed5m || 0)}, ${esc(c.state || '')}`).join(' · ')}</div>`;
  }
  if ((d.days || []).length) x += `<div class="muted">Downloaded per day: ${d.days.map((y) => `${esc(y.day.slice(5))} <b>${fmtNum(y.files)}</b> files, ${fmtSize(y.bytes)}`).join(' · ')}</div>`;
  return x;
})()}
<div class="muted">A failed file is first retried a few times by the download engine. ${state.status.settings.autoRetry ? `After that, it goes back in the queue every ${Math.round(d.retryAfterMin / 60)} hours, up to ${d.retryRounds} times (Settings).` : 'Automatic retries every few hours are <b>off</b> (Settings).'} A group's files pass also tries its failed files again.</div>`;
  if (d.errors && d.errors.length) {
    h += `<div class="list" style="margin-top:8px"><table><tr><th>Why files failed</th><th>Files</th></tr>${d.errors.map((e) => `<tr><td class="muted">${esc(e.error)}</td><td class="n">${fmtNum(e.count)}</td></tr>`).join('')}</table></div>`;
  }
  h += `<div class="btns"><button class="b" data-act="dl-retry" ${d.failed && d.engineRunning ? '' : 'disabled'}>Retry all ${fmtNum(d.failed)} failed now</button>${state.dlMsg ? `<span class="muted">${esc(state.dlMsg)}</span>` : ''}</div></div>`;
  return h;
}

// ---------------- Rescan ----------------
function viewRescan() {
  const s = state.status;
  const q = s.queue || { items: [] };
  const items = q.items || [];
  const counts = { waiting: 0, running: 0, done: 0, failed: 0 };
  items.forEach((i) => (counts[i.state] = (counts[i.state] || 0) + 1));
  const saved = items.filter((i) => i.messagesAt || (i.state === 'done' && !i.phase)).length;
  let head;
  if (q.running) head = `<b>Running</b> — messages saved for ${saved} of ${items.length} group(s); ${counts.done} fully done${counts.failed ? `, ${counts.failed} failed` : ''}.`;
  else if (items.length && counts.waiting + counts.running) head = `<b>Paused</b> — ${counts.done} of ${items.length} group(s) done.`;
  else if (items.length) head = `<b>Finished</b> — ${counts.done} of ${items.length} group(s) done${counts.failed ? `, ${counts.failed} failed` : ''}.`;
  else head = '<b>Nothing queued.</b> Tick groups below and add them.';
  const notQueued = groups().filter((g) => !g.finishedAt && !items.some((i) => i.groupId === g.id && (i.state === 'waiting' || i.state === 'running')));
  let h = `<div class="card"><h2>Rescan everything</h2><div class="muted">Full history of every group, one group after another, with photos, videos <b>and files/documents</b> switched on. Groups already in the queue are skipped.</div>
<div class="btns"><button class="b primary" data-act="p-everything" ${notQueued.length ? '' : 'disabled'}>Rescan all ${notQueued.length} group(s)</button></div></div>`;
  h += `<div class="status">${head} Two lanes run side by side, one group each. <b>Messages:</b> every group's history is saved, without waiting for downloads. <b>Files:</b> as soon as a group's messages are saved, it is walked again to fetch the files still missing (failed files get another try too). <b>★ First</b> groups go first in both lanes. Runs inside the server — you can close this page.${q.notice ? `<div class="muted" style="margin-top:4px">${esc(q.notice)}</div>` : ''}</div>`;
  h += `<div class="btns" style="margin-bottom:12px">${q.running ? `<button class="b" data-act="q-pause">Pause</button>` : `<button class="b primary" data-act="q-start" ${counts.waiting ? '' : 'disabled'}>Start</button>`}
<button class="b" data-act="q-clear-finished" ${counts.done + counts.failed ? '' : 'disabled'}>Remove finished</button><button class="b" data-act="q-clear" ${items.length ? '' : 'disabled'}>Clear queue</button>
<span class="muted">Retries: ${q.maxAttempts ? 'up to ' + q.maxAttempts : 'unlimited'}</span></div>`;
  if (items.length) {
    h += `<div class="list" style="margin-bottom:12px"><table><tr><th>#</th><th>Group</th><th>Step</th><th>Messages saved</th><th>Files missing</th><th title="New downloads this group's files pass has added to the download queue">Files queued</th><th>Tries</th><th></th></tr>`;
    // Shown in the order they run: running, then waiting (★ first), failed, done.
    const order = { running: 0, waiting: 1, failed: 2, done: 3 };
    const shownItems = items.map((it, i) => ({ it, i })).sort((a, b) => ((order[a.it.state] ?? 4) - (order[b.it.state] ?? 4))
      || (a.it.state === 'waiting' ? ((b.it.priority ? 1 : 0) - (a.it.priority ? 1 : 0)) : 0) || (a.i - b.i)).map((x) => x.it);
    shownItems.forEach((it, i) => {
      const when = (it.state === 'waiting' && it.nextAt > Date.now() ? ` · retry ${esc(fmtTime(it.nextAt))}` : '') + (it.resumeFrom && it.state !== 'done' ? ` · continues below message #${it.resumeFrom}` : '');
      const files = it.phase === 'files';
      const label = { waiting: files ? 'files: waiting' : 'messages: waiting', running: files ? 'fetching files' : 'saving messages', done: 'done', failed: 'failed' }[it.state] || it.state;
      const msgs = it.messagesAt ? it.messages : (it.state === 'running' && !files) || (it.state === 'done' && !it.phase) ? (it.carried || 0) + it.processed : it.carried ? it.carried : null;
      const missing = it.messagesAt ? it.missing : null;
      h += `<tr><td class="n">${i + 1}</td><td>${it.priority ? '<b title="Goes first, files included">★</b> ' : ''}${esc(it.name)}${it.error ? `<div class="muted bad">${esc(it.error)}</div>` : ''}</td><td><span class="pill ${esc(it.state)}">${esc(label)}</span><span class="muted">${when}</span></td><td class="n">${msgs === null ? '<span class="muted">–</span>' : fmtNum(msgs)}</td><td class="n">${missing === null ? '<span class="muted">–</span>' : fmtNum(missing)}</td><td class="n">${(files && it.state !== 'waiting') || !it.phase ? fmtNum(it.downloaded) : '<span class="muted">–</span>'}</td><td class="n">${it.attempts || 0}</td>
<td>${it.state === 'running' || it.state === 'waiting' ? `<button class="mini" data-act="q-priority" data-id="${esc(it.groupId)}" data-on="${it.priority ? '' : '1'}">${it.priority ? 'Remove ★' : '★ First'}</button>` : `<button class="mini" data-act="q-retry" data-id="${esc(it.groupId)}">Run again</button>`}<button class="mini" data-act="q-remove" data-id="${esc(it.groupId)}">${it.state === 'running' ? 'Stop' : 'Remove'}</button></td></tr>`;
    });
    h += `</table></div>`;
  }
  // picker
  const queued = new Set(items.filter((i) => i.state === 'waiting' || i.state === 'running').map((i) => i.groupId));
  let list = groups().map((g) => ({ id: g.id, name: g.name, files: g.files, never: !g.lastWalk, finished: !!g.finishedAt,
    sub: (g.finishedAt ? '<b>finished</b> — rescans leave it alone (undo on the Overview) · ' : '') + (g.category ? esc(g.category) + ' · ' : '') + (g.files ? fmtNum(g.files) + ' files downloaded · ' : 'no files yet · ') + (g.lastWalk ? 'messages captured, last rescan ' + fmtTime(g.lastWalk) : (g.files ? '<b>messages not captured yet</b>' : 'never rescanned')) }));
  const withFiles = groups().filter((g) => g.files > 0 && !g.lastWalk && !g.finishedAt && !queued.has(g.id)).length;
  if (state.showAll && state.dialogs) {
    const have = new Set(list.map((x) => x.id));
    for (const d of state.dialogs) if (!have.has(d.id)) list.push({ id: d.id, name: d.name, sub: 'not in the downloader yet (' + (d.type || 'chat') + ')', extra: true });
  }
  const qq = state.pickSearch.trim().toLowerCase();
  // Ticks are kept while you search: search, tick, search again, tick more.
  const shown = list.filter((x) => (state.pickOnly ? state.pick.has(x.id) : !qq || x.name.toLowerCase().includes(qq))).sort((a, b) => natural(a.name, b.name));
  h += `<div class="card"><h2>Choose groups</h2><div class="muted">Search, tick, then search for the next ones: ticks stay when you change or clear the search. <b>${state.pick.size} ticked</b> ${state.pick.size ? `<button class="mini" data-act="p-only">${state.pickOnly ? 'Show all' : 'Show only ticked'}</button>` : ''}</div>
<div class="btns"><input class="t" style="flex:1;min-width:200px" placeholder="Search ${list.length} chats…" data-in="pickSearch" data-focus="pick" value="${esc(state.pickSearch)}">
<button class="mini" data-act="p-clear-search" ${state.pickSearch ? '' : 'disabled'}>Clear search</button><button class="mini" data-act="p-all">Tick all ${shown.length} shown</button><button class="mini" data-act="p-files" ${withFiles ? '' : 'disabled'}>Tick the ${withFiles} with files but no messages captured</button><button class="mini" data-act="p-never">Tick never rescanned</button><button class="mini" data-act="p-none">Untick all</button>
<button class="mini" data-act="p-dialogs" ${state.dialogsLoading ? 'disabled' : ''}>${state.dialogsLoading ? 'Loading chats…' : state.showAll ? 'Hide other chats' : 'Show all my chats'}</button></div>
<div class="list">${shown.map((x) => `<div class="row" style="grid-template-columns:1fr"><label><input type="checkbox" data-pick="${esc(x.id)}" data-name="${esc(x.name)}" data-finished="${x.finished ? '1' : ''}" ${state.pick.has(x.id) ? 'checked' : ''}><span><b>${esc(x.name)}</b> <span class="muted">${x.extra ? esc(x.sub) : x.sub}${queued.has(x.id) ? ' · in the queue' : ''}</span></span></label></div>`).join('') || '<div class="muted" style="padding:8px">No chats match.</div>'}</div>
<label class="muted"><input type="checkbox" data-in-check="ensureFilters" ${state.ensureFilters ? 'checked' : ''}> Switch on photos, videos <b>and files/documents</b> for these groups (recommended)</label>
<div class="btns"><button class="b primary" data-act="p-add" ${state.pick.size ? '' : 'disabled'}>Rescan ${state.pick.size} ticked group(s)</button><button class="b" data-act="p-add-first" ${state.pick.size ? '' : 'disabled'}>★ Rescan ${state.pick.size} ticked first</button><span class="grow"></span><button class="b" data-act="p-finish" ${state.pick.size ? '' : 'disabled'}>✓ Mark ${state.pick.size} ticked finished</button><button class="mini" data-act="p-reopen" ${state.pick.size ? '' : 'disabled'}>Reopen ticked</button></div>
<div class="muted">★ First: these groups go ahead of all others, for their messages and then their files. Ticking a group that is already queued just moves it to the front, keeping its progress.</div></div>`;
  return h;
}

// ---------------- Categories ----------------
function shownGroups() {
  const q = state.search.trim().toLowerCase();
  return groups().filter((g) => {
    const c = catOf(g).trim();
    if (state.filter === NONE && c) return false;
    if (state.filter === UNSAVED && !(state.draft.has(g.id) && c !== (g.category || ''))) return false;
    if (state.filter && state.filter !== NONE && state.filter !== UNSAVED && c !== state.filter) return false;
    return !q || g.name.toLowerCase().includes(q) || c.toLowerCase().includes(q);
  });
}
function viewCategories() {
  const all = groups();
  const catCount = new Map();
  let uncat = 0;
  for (const g of all) { const c = catOf(g).trim(); if (c) catCount.set(c, (catCount.get(c) || 0) + 1); else uncat++; }
  const cats = [...catCount.keys()].sort(natural);
  const ch = changed().length;
  if (state.filter && state.filter !== NONE && state.filter !== UNSAVED && !catCount.has(state.filter)) state.filter = '';
  const shown = shownGroups();
  const clusters = new Map();
  for (const g of all) { if (catOf(g).trim()) continue; const s = suggestG(g); if (s) { const k = s.toLowerCase(); const c = clusters.get(k) || { name: s, ids: [] }; c.ids.push(g.id); clusters.set(k, c); } }
  const options = [...new Set(cats.concat([...clusters.values()].map((c) => c.name)))];
  const chip = (key, label, n) => `<button class="chip ${state.filter === key ? 'on' : ''}" data-act="c-filter" data-key="${esc(key)}">${esc(label)} <span>${n}</span></button>`;
  let h = `<div class="card"><h2>Categories</h2><div class="muted">Group related groups together (football-1, sports-3 and soccer-6 can all be "Sports"). In the index, each category gets a page showing every file once, with "also in…" links to everywhere it was posted.</div>
<div class="sticky">
<input class="t" type="search" placeholder="Search ${all.length} groups by name or category…" data-in="search" data-focus="csearch" value="${esc(state.search)}">
<div class="chips">${chip('', 'All', all.length)}${chip(NONE, 'Uncategorised', uncat)}${ch ? chip(UNSAVED, 'Unsaved', ch) : ''}${cats.map((c) => chip(c, c, catCount.get(c))).join('')}</div>
<div class="btns"><input class="t" style="flex:1;min-width:160px" list="ixcats" placeholder="Category for ticked groups" data-in="bulk" data-focus="bulk" value="${esc(state.bulk)}"><button class="b" data-act="c-bulk" ${state.sel.size ? '' : 'disabled'}>Set for ${state.sel.size} ticked</button><button class="b" data-act="c-bulk-clear" ${state.sel.size ? '' : 'disabled'}>Clear</button></div>
<div class="btns"><button class="mini" data-act="c-all" ${shown.length ? '' : 'disabled'}>Tick all ${shown.length} shown</button><button class="mini" data-act="c-none" ${state.sel.size ? '' : 'disabled'}>Untick all${state.sel.size ? ` (${state.sel.size})` : ''}</button><span class="grow"></span>
<button class="b" data-act="c-undo" ${ch && !state.saving ? '' : 'disabled'}>Undo changes</button><button class="b primary" data-act="c-save" ${ch && !state.saving ? '' : 'disabled'}>${state.saving ? 'Saving…' : `Save ${ch} change${ch === 1 ? '' : 's'}`}</button></div>
${state.msg ? `<div class="muted">${esc(state.msg)}</div>` : ''}</div>
<datalist id="ixcats">${options.map((c) => `<option value="${esc(c)}"></option>`).join('')}</datalist>`;
  if (clusters.size && state.filter !== UNSAVED) {
    const list = [...clusters.values()].sort((a, b) => b.ids.length - a.ids.length || natural(a.name, b.name));
    h += `<div class="muted">Suggested categories for uncategorised groups (from similar names, or from the pictures and videos they share with a category's groups) — click to tick them: ${list.slice(0, 60).map((c) => `<button class="chip" data-act="c-cluster" data-key="${esc(c.name.toLowerCase())}">${esc(c.name)}… <span>${c.ids.length}</span></button>`).join(' ')} <button class="mini" data-act="c-suggest">Use all ${list.reduce((n, c) => n + c.ids.length, 0)} suggestions as they are</button></div>`;
  }
  h += `<div class="muted">${shown.length === all.length ? `${all.length} groups` : `Showing ${shown.length} of ${all.length} groups`}. Changes are kept until you press Save; a dot marks unsaved ones.</div><div class="rows">`;
  for (const g of shown) {
    const cur = catOf(g);
    const dirty = state.draft.has(g.id) && cur.trim() !== (g.category || '');
    const s = suggestG(g);
    h += `<div class="row${state.sel.has(g.id) ? ' sel' : ''}"><label><input type="checkbox" data-sel="${esc(g.id)}" ${state.sel.has(g.id) ? 'checked' : ''}><span>${esc(g.name)}${dirty ? ' <b class="warn">•</b>' : ''}</span></label><span class="cat"><input class="t" list="ixcats" data-cat="${esc(g.id)}" data-focus="cat-${esc(g.id)}" value="${esc(cur)}" placeholder="Uncategorised">${s && !cur.trim() ? `<button class="chip" data-act="c-use" data-id="${esc(g.id)}" title="${esc(suggestWhy(g))}">→ ${esc(s)}${suggestName(g.name) ? '' : ' <span>by content</span>'}</button>` : ''}</span></div>`;
  }
  h += `</div></div>`;
  return h;
}

// ---------------- Duplicates ----------------
const fmtSize = (n) => (n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? Math.round(n / 1024) + ' KB' : (n || 0) + ' B');
const fmtDur = (s) => { s = Math.round(s || 0); const m = Math.floor(s / 60); return m + ':' + String(s % 60).padStart(2, '0'); };
async function loadDups(more) {
  const offset = more && state.dups ? state.dups.clusters.length : 0;
  const r = await api('GET', '/api/ix/dups?limit=50&offset=' + offset);
  if (r.ok) {
    if (more && state.dups) { state.dups.clusters = state.dups.clusters.concat(r.data.clusters || []); state.dups.status = r.data.status; }
    else state.dups = r.data;
  } else state.error = 'Could not load duplicates: ' + errText(r);
  render();
}
function viewDuplicates() {
  const s = state.status.settings;
  const st = (state.dups && state.dups.status) || state.status.dups || {};
  const pct = st.total ? Math.floor((100 * st.done) / st.total) : 100;
  let h = `<div class="card"><h2>Near-duplicate videos</h2>
<div class="muted">Finds the same footage saved as different files — re-encoded, resized, trimmed or watermarked — which identical-file matching can't see. It samples each video on a fixed time grid (one or two frames a second, on the graphics card when it can), cuts off black bars, also checks mirror images, and compares the footage frame by frame. Pictures are matched the same way in the media browser. Nothing is deleted or moved: the index shows each set once on category pages and lists them in near_duplicates.csv.</div>`;
  if (st.ffmpeg === false) h += `<div class="status warn"><b>ffmpeg is not installed on this PC</b>, so videos can't be checked yet. Open PowerShell and run <code>winget install Gyan.FFmpeg</code>, then restart the app (close and reopen start.bat).</div>`;
  h += `<div><b>${fmtNum(st.done)} of ${fmtNum(st.total)} videos checked</b> (${pct}%)${st.errors ? ` · <span class="warn">${fmtNum(st.errors)} could not be read</span> <button class="mini" data-act="d-retry">Try them again</button>` : ''} · ${fmtNum(st.pairs)} matching pairs found${st.running ? ` · now: <span class="muted">${esc(st.current)}</span> (${esc(st.hwaccel === 'cpu' ? 'processor' : 'graphics card: ' + st.hwaccel)})` : s.dupEnabled ? ' · idle' : ' · <b>paused</b>'}</div>
${st.lastError ? `<div class="muted">Last problem: ${esc(st.lastError)}</div>` : ''}
<div class="btns"><label><input type="checkbox" data-dset="dupEnabled" ${s.dupEnabled ? 'checked' : ''}> Check videos in the background</label>
<label>Decode on: <select class="t" data-dset-select="dupHwaccel">${[['cuda', 'NVIDIA graphics card (CUDA)'], ['d3d11va', 'Any graphics card (Direct3D 11)'], ['qsv', 'Intel graphics (Quick Sync)'], ['none', 'Processor only']].map(([v, l]) => `<option value="${v}" ${s.dupHwaccel === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
<span>Pause between <input class="t" data-dset-text="dupQuietStart" value="${esc(s.dupQuietStart || '')}" placeholder="" style="width:70px"> and <input class="t" data-dset-text="dupQuietEnd" value="${esc(s.dupQuietEnd || '')}" style="width:70px"></span>
<button class="b" data-act="d-save">Save</button></div>
<div class="muted">If the graphics card fails on a video, that video is decoded on the processor instead.</div></div>`;
  const d = state.dups;
  if (!d) return h + '<div class="muted">Loading…</div>';
  h += `<div class="card"><h2>${fmtNum(d.total)} set(s) of near-duplicates</h2><div class="muted">Keeping only the largest copy of each set would free about <b>${fmtSize(d.spareSize)}</b>. Biggest savings first. <a href="/ix/view/near_duplicates.csv">Download the list (CSV)</a></div>`;
  for (const c of d.clusters) {
    h += `<div style="border-top:1px solid var(--line);padding:10px 0"><div class="muted">${c.kind === 'same' ? 'Same video' : 'Same footage, some copies are shorter clips'} · ${c.members.length} files · ${fmtSize(c.spareSize)} beyond the largest</div><div class="chips" style="margin-top:6px">`;
    for (const m of c.members) {
      h += `<div style="border:1px solid var(--line);border-radius:8px;overflow:hidden;width:190px">${m.downloadId ? `<img loading="lazy" src="/api/thumbs/${m.downloadId}" style="width:190px;height:110px;object-fit:cover;display:block;background:var(--soft)" alt="">` : ''}<div style="padding:6px 8px;font-size:12px"><b>${fmtSize(m.size)}</b> · ${fmtDur(m.duration)}<br>${m.places.slice(0, 3).map((p) => p.link ? `<a href="${esc(p.link)}" target="_blank">${esc(p.label)}</a>` : esc(p.label)).join('<br>')}${m.places.length > 3 ? `<br>+${m.places.length - 3} more` : ''}</div></div>`;
    }
    h += `</div></div>`;
  }
  if (d.clusters.length < d.total) h += `<div class="btns"><button class="b" data-act="d-more">More</button></div>`;
  return h + `</div>`;
}

const TABS = [['overview', 'Overview'], ['rescan', 'Rescan'], ['categories', 'Categories'], ['duplicates', 'Duplicates'], ['search', 'Search'], ['settings', 'Settings']];
function render() {
  const prev = document.activeElement;
  const focusKey = prev && prev.getAttribute ? prev.getAttribute('data-focus') : null;
  const caret = focusKey && typeof prev.selectionStart === 'number' ? prev.selectionStart : null;
  const y = window.scrollY;
  // Scrolled lists keep their place when the numbers refresh.
  const listScroll = [...$app.querySelectorAll('.list,.rows')].map((el) => el.scrollTop);
  let h = `<header class="top"><h1>Archive</h1><nav class="tabs">${TABS.map(([k, l]) => `<button class="tab ${state.tab === k ? 'on' : ''}" data-act="tab" data-key="${k}">${l}</button>`).join('')}</nav><span class="grow"></span><a href="/">← Dashboard</a></header>`;
  if (state.error) h += `<div class="status bad">${esc(state.error)} <button class="b" data-act="reload">Try again</button></div>`;
  if (!state.status) { $app.innerHTML = h + (state.error ? '' : '<p class="muted">Loading…</p>'); return; }
  h += banner();
  const view = { overview: viewOverview, rescan: viewRescan, categories: viewCategories, duplicates: viewDuplicates, search: viewSearch, settings: viewSettings }[state.tab] || viewOverview;
  h += view();
  $app.innerHTML = h;
  window.scrollTo(0, y);
  $app.querySelectorAll('.list,.rows').forEach((el, i) => { if (listScroll[i]) el.scrollTop = listScroll[i]; });
  if (focusKey) {
    const el = $app.querySelector(`[data-focus="${CSS.escape(focusKey)}"]`);
    if (el) { el.focus(); if (caret !== null) { try { el.setSelectionRange(caret, caret); } catch { /* ignore */ } } }
  }
}

async function saveCategories() {
  const list = changed();
  if (state.saving || !list.length) return;
  state.saving = true; state.msg = ''; render();
  let ok = 0; const failed = [];
  for (const g of list) {
    const value = state.draft.get(g.id).trim();
    const r = await api('PUT', '/api/groups/' + encodeURIComponent(g.id), { category: value });
    if (r.ok) { g.category = value; state.draft.delete(g.id); ok++; } else failed.push(g.name);
  }
  state.saving = false;
  state.msg = `Saved ${ok} group(s).` + (failed.length ? ` Could not save: ${failed.join(', ')}.` : '');
  render();
}

async function runSearch(more) {
  if (!state.q.trim()) return;
  state.searching = true; if (!more) state.hits = null; render();
  const offset = more && state.hits ? state.hits.length : 0;
  const r = await api('GET', `/api/ix/search?q=${encodeURIComponent(state.q)}&category=${encodeURIComponent(state.qCategory)}&limit=50&offset=${offset}`);
  state.searching = false;
  if (r.ok) { state.hits = (more && state.hits ? state.hits : []).concat(r.data.hits || []); state.qMore = !!r.data.more; }
  else { state.hits = []; state.error = 'Search failed: ' + errText(r); }
  render();
}

async function loadDialogs() {
  state.dialogsLoading = true; render();
  const r = await api('GET', '/api/dialogs?archived=false');
  state.dialogsLoading = false;
  if (r.ok) {
    const list = Array.isArray(r.data) ? r.data : (r.data && (r.data.dialogs || r.data.items)) || [];
    state.dialogs = list.filter((d) => d && d.id != null && d.type !== 'user' && d.type !== 'bot').map((d) => ({ id: String(d.id), name: String(d.name || d.title || d.id), type: d.type }));
    state.showAll = true;
  } else state.error = 'Could not load your chats: ' + errText(r);
  render();
}

$app.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.getAttribute('data-act');
  const key = el.getAttribute('data-key') || '';
  const id = el.getAttribute('data-id');
  const all = groups();
  switch (act) {
    case 'tab': state.tab = key; location.hash = key; render(); if (key !== 'search') load(); if (key === 'duplicates') loadDups(false); break;
    case 'd-more': loadDups(true); break;
    case 'd-retry': { const r = await api('POST', '/api/ix/dups/retry'); if (!r.ok) state.error = errText(r); loadDups(false); break; }
    case 'd-save': {
      const body = {};
      for (const x of $app.querySelectorAll('[data-dset]')) body[x.getAttribute('data-dset')] = x.checked;
      for (const x of $app.querySelectorAll('[data-dset-text]')) body[x.getAttribute('data-dset-text')] = x.value.trim();
      for (const x of $app.querySelectorAll('[data-dset-select]')) body[x.getAttribute('data-dset-select')] = x.value;
      const r = await api('POST', '/api/ix/settings', body);
      if (!r.ok) state.error = 'Not saved: ' + errText(r);
      await load(); loadDups(false); break;
    }
    case 'reload': load(); break;
    case 'diag': { const r = await fetch('/api/ix/diagnostics', { credentials: 'same-origin' }); state.diag = r.ok ? await r.text() : ''; state.diagMsg = r.ok ? '' : 'Could not make the report: HTTP ' + r.status; render(); break; }
    case 'diag-copy': { try { await navigator.clipboard.writeText(state.diag); state.diagMsg = 'Copied.'; } catch { const t = document.getElementById('diag'); if (t) { t.select(); document.execCommand('copy'); } state.diagMsg = 'Copied.'; } render(); break; }
    case 'freeze-check': { const r = await api('POST', '/api/ix/freeze/check'); if (!r.ok) state.error = 'Could not read the freeze state: ' + errText(r); load(); break; }
    case 'held-release': { const r = await api('POST', '/api/ix/held/release'); state.keepMsg = r.ok ? 'The held files are back in the download queue.' : errText(r); load(); break; }
    case 'subst-fetch': {
      if (!confirm('Download the real files of every re-upload that was matched to a saved file? Their groups get a files pass.')) break;
      const r = await api('POST', '/api/ix/subst/fetch');
      if (!r.ok) { state.keepMsg = errText(r); load(); break; }
      if (r.data.groups && r.data.groups.length) await api('POST', '/api/ix/queue/add', { groups: r.data.groups.map((id) => ({ id })), start: true, includeFinished: true });
      state.keepMsg = `${fmtNum(r.data.files)} file(s) will be downloaded in full by their groups' next files pass.`; load(); break;
    }
    case 'dl-retry': {
      const r = await api('POST', '/api/ix/downloads/retry');
      state.dlMsg = r.ok ? `${fmtNum(r.data.retried)} file(s) put back in the queue.` : 'Could not retry: ' + errText(r);
      load(); break;
    }
    case 'export': { const r = await api('POST', '/api/ix/export'); if (!r.ok) state.error = errText(r); load(); break; }
    case 'q-start': case 'q-pause': case 'q-clear-finished': case 'q-clear': {
      if (act === 'q-clear' && !confirm('Remove every group from the queue? A group being rescanned now is kept.')) break;
      const r = await api('POST', '/api/ix/queue/' + act.slice(2)); if (!r.ok) state.error = errText(r); load(); break;
    }
    case 'q-retry': case 'q-remove': { const r = await api('POST', '/api/ix/queue/' + act.slice(2), { groupId: id }); if (!r.ok) state.error = errText(r); load(); break; }
    case 'p-all': for (const x of $app.querySelectorAll('input[data-pick]:not([disabled])')) state.pick.add(x.getAttribute('data-pick')); render(); break;
    case 'p-never': for (const g of all) if (!g.lastWalk && !g.finishedAt) state.pick.add(g.id); render(); break;
    case 'p-files': for (const g of all) if (g.files > 0 && !g.lastWalk && !g.finishedAt) state.pick.add(g.id); render(); break;
    case 'p-none': state.pick.clear(); state.pickOnly = false; render(); break;
    case 'p-only': state.pickOnly = !state.pickOnly; render(); break;
    case 'p-clear-search': state.pickSearch = ''; state.pickOnly = false; render(); { const el = $app.querySelector('[data-focus="pick"]'); if (el) el.focus(); } break;
    case 'p-dialogs': if (state.showAll) { state.showAll = false; render(); } else if (state.dialogs) { state.showAll = true; render(); } else loadDialogs(); break;
    case 'p-everything': {
      const list = groups().filter((g) => !g.finishedAt && !(state.status.queue.items || []).some((i) => i.groupId === g.id && (i.state === 'waiting' || i.state === 'running'))).map((g) => ({ id: g.id, name: g.name }));
      const r = await api('POST', '/api/ix/queue/add', { groups: list, ensureFilters: true, start: true });
      if (!r.ok) state.error = 'Could not add: ' + errText(r);
      load(); break;
    }
    case 'p-finish': case 'p-reopen': {
      const ids = [...state.pick];
      const r = await api('POST', '/api/ix/groups/finished', { groupIds: ids, finished: act === 'p-finish' });
      if (r.ok) { state.pick.clear(); state.pickOnly = false; } else state.error = errText(r);
      load(); break;
    }
    case 'g-finish': case 'g-open': { const r = await api('POST', '/api/ix/groups/finished', { groupIds: [id], finished: act === 'g-finish' }); if (!r.ok) state.error = errText(r); load(); break; }
    case 'g-finish-complete': {
      const ids = (state.status.groups || []).filter((g) => !g.finishedAt && g.tgCount && g.lastWalk && g.tgCount - (g.messages - g.deleted) <= 0).map((g) => g.id);
      if (!ids.length || !confirm(`Mark ${ids.length} complete group(s) as finished? Rescans will leave them alone (you can undo each one).`)) break;
      const r = await api('POST', '/api/ix/groups/finished', { groupIds: ids, finished: true }); if (!r.ok) state.error = errText(r); load(); break;
    }
    case 'q-priority': { const r = await api('POST', '/api/ix/queue/priority', { groupId: id, priority: el.getAttribute('data-on') === '1' }); if (!r.ok) state.error = errText(r); load(); break; }
    case 'p-add': case 'p-add-first': {
      const names = new Map();
      for (const x of $app.querySelectorAll('input[data-pick]')) names.set(x.getAttribute('data-pick'), x.getAttribute('data-name'));
      const list = [...state.pick].map((gid) => ({ id: gid, name: names.get(gid) || gid }));
      const r = await api('POST', '/api/ix/queue/add', { groups: list, ensureFilters: state.ensureFilters, start: true, priority: act === 'p-add-first' });
      if (r.ok) { state.pick.clear(); state.pickOnly = false; state.pickSearch = ''; if (r.data.skippedFinished) state.error = `${r.data.skippedFinished} finished group(s) were left out.`; } else state.error = 'Could not add: ' + errText(r);
      load(); break;
    }
    case 'c-filter': state.filter = key; render(); break;
    case 'c-all': for (const g of shownGroups()) state.sel.add(g.id); render(); break;
    case 'c-none': state.sel.clear(); render(); break;
    case 'c-bulk': for (const gid of state.sel) state.draft.set(gid, state.bulk.trim()); state.msg = ''; render(); break;
    case 'c-bulk-clear': for (const gid of state.sel) state.draft.set(gid, ''); state.msg = ''; render(); break;
    case 'c-cluster': for (const g of all) if (!catOf(g).trim() && suggestG(g).toLowerCase() === key) state.sel.add(g.id); render(); break;
    case 'c-use': { const g = all.find((x) => x.id === id); if (g) state.draft.set(g.id, suggestG(g)); render(); break; }
    case 'c-suggest': for (const g of all) { const s = suggestG(g); if (!catOf(g).trim() && s) state.draft.set(g.id, s); } render(); break;
    case 'c-undo': state.draft.clear(); state.msg = 'Unsaved changes undone.'; render(); break;
    case 'c-save': saveCategories(); break;
    case 's-go': runSearch(false); break;
    case 's-more': runSearch(true); break;
    case 'alert-test': {
      const r = await api('POST', '/api/ix/alerts/test');
      state.setMsg = r.ok ? 'Test alert sent. Check your phone or inbox.' : 'Test alert failed: ' + errText(r);
      render(); break;
    }
    case 'ml-check': {
      state.mlMsg = 'Checking (the first time, the service downloads its model: this can take a few minutes)…'; render();
      const r = await api('POST', '/api/ix/ml/check');
      state.mlMsg = r.ok ? 'Image recognition works.' : 'Image recognition: ' + errText(r);
      load(); break;
    }
    case 'stt-check': {
      state.sttMsg = 'Checking (the first time, the service downloads its model, about 3 GB: this can take a while)…'; render();
      const r = await api('POST', '/api/ix/stt/check');
      state.sttMsg = r.ok ? 'Speech to text works.' : 'Speech to text: ' + errText(r);
      load(); break;
    }
    case 'dl-loss': {
      const r = await api('GET', '/api/ix/deadline');
      state.loss = r.ok ? r.data : { error: errText(r) };
      render(); break;
    }
    case 'set-save': {
      const body = {};
      for (const x of $app.querySelectorAll('[data-set]')) body[x.getAttribute('data-set')] = x.checked;
      for (const x of $app.querySelectorAll('[data-set-text]')) body[x.getAttribute('data-set-text')] = x.value.trim();
      for (const x of $app.querySelectorAll('[data-set-select]')) body[x.getAttribute('data-set-select')] = x.value;
      const r = await api('POST', '/api/ix/settings', body);
      state.setMsg = r.ok ? 'Saved.' : 'Not saved: ' + errText(r);
      load(); break;
    }
  }
});

$app.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.matches('[data-in]')) {
    const k = t.getAttribute('data-in');
    state[k] = t.value;
    if (k === 'pickSearch') state.pickOnly = false;
    if (k === 'search' || k === 'pickSearch') render();
  } else if (t.matches('[data-cat]')) {
    state.draft.set(t.getAttribute('data-cat'), t.value);
    const n = changed().length;
    const btn = $app.querySelector('[data-act="c-save"]');
    if (btn && !state.saving) { btn.disabled = !n; btn.textContent = `Save ${n} change${n === 1 ? '' : 's'}`; }
    const undo = $app.querySelector('[data-act="c-undo"]');
    if (undo) undo.disabled = !n;
  }
});
$app.addEventListener('change', (ev) => {
  const t = ev.target;
  if (t.matches('[data-sel]')) { const gid = t.getAttribute('data-sel'); if (t.checked) state.sel.add(gid); else state.sel.delete(gid); render(); }
  else if (t.matches('[data-pick]')) { const gid = t.getAttribute('data-pick'); if (t.checked) state.pick.add(gid); else state.pick.delete(gid); render(); }
  else if (t.matches('[data-in-check]')) state[t.getAttribute('data-in-check')] = t.checked;
  else if (t.matches('[data-sel-in]')) state[t.getAttribute('data-sel-in')] = t.value;
});
$app.addEventListener('keydown', (ev) => {
  if (ev.key === 'Enter' && ev.target.matches('[data-in="q"]')) runSearch(false);
});
window.addEventListener('hashchange', () => { const k = (location.hash || '#overview').slice(1); if (k !== state.tab) { state.tab = k; render(); } });

load();
if (state.tab === 'duplicates') loadDups(false);
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  const busy = document.activeElement && document.activeElement.matches && document.activeElement.matches('[data-dset],[data-dset-text],[data-dset-select]');
  if (busy) return; // don't redraw under someone editing the duplicate settings
  if (state.tab === 'rescan' || state.tab === 'overview') load();
  if (state.tab === 'duplicates' && state.dups && state.dups.clusters.length <= 50) loadDups(false);
}, 10000);
})();
</script>
</body>
</html>
