name: Sync with the original project

# Daily: merge botnick/telegram-media-downloader into a branch of this fork,
# run the tests, and open a pull request for a person to review. Nothing is
# merged into main or published by this job: start.bat installs whatever is
# released on this fork, so an unreviewed change of the original project
# must never reach a running archive on its own. On a failing test the
# pull request is not opened and this run fails, so GitHub emails the owner.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge the original project
        id: merge
        run: |
          set -eu
          git config user.name "ix-sync"
          git config user.email "ix-sync@users.noreply.github.com"
          git remote add upstream https://github.com/botnick/telegram-media-downloader.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          file=core-service/internal/version/app.go
          ours=$(sed -n 's/^var AppVersion = "\(.*\)"$/\1/p' "$file")
          if ! git merge --no-edit upstream/main; then
            conflicts=$(git diff --name-only --diff-filter=U | grep -v "^$file\$" || true)
            if [ -n "$conflicts" ]; then
              # Where both sides changed the same lines, take the original
              # project's version. The archive's own tests (below) then show
              # whether its hooks survived; if not, nothing is published.
              echo "Conflicts resolved in favour of the original project: $conflicts"
              git merge --abort
              git merge --no-edit -X theirs upstream/main
            else
              # Only the version line conflicted; it is set below.
              git checkout --theirs "$file" && git add "$file"
              git commit --no-edit
            fi
          fi
          up=$(git show upstream/main:"$file" | sed -n 's/^var AppVersion = "\(.*\)"$/\1/p')
          base=${ours%%-ix.*}
          n=${ours##*-ix.}
          case "$n" in ''|*[!0-9]*) n=0;; esac
          if [ "$up" = "$base" ]; then n=$((n+1)); else n=1; fi
          new="$up-ix.$n"
          sed -i "s/^var AppVersion = \".*\"$/var AppVersion = \"$new\"/" "$file"
          git commit -am "Sync with the original project (version $new)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.merge.outputs.changed == 'true'
        with:
          go-version-file: core-service/go.mod
          cache-dependency-path: core-service/go.sum
      - name: Test before publishing
        if: steps.merge.outputs.changed == 'true'
        run: |
          go -C core-service vet ./...
          go -C core-service test ./...
      - name: Open a pull request for review
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          set -eu
          branch="sync/upstream-$(git log -1 --format=%h upstream/main)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Already offered for review in $branch."
            exit 0
          fi
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --title "Sync with the original project ($VERSION)" \
            --body "The original project changed ($(git log -1 --format=%h upstream/main)). Merged into this branch, with the archive's tests passing. Where both sides changed the same lines, the original project's version was taken: review before merging. Nothing is released until a person publishes a release."
