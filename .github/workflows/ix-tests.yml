name: Archive features (with ffmpeg)

# The archive's own tests, with ffmpeg installed so the near-duplicate video
# check runs on real videos too.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: core-service/go.mod
          cache-dependency-path: core-service/go.sum
      - name: Install ffmpeg
        # A static build first; the package mirror only when none can be had.
        timeout-minutes: 15
        run: bash scripts/ci-install-ffmpeg.sh
      - name: Archive tests
        env:
          IX_SAMPLE_OUT: ${{ runner.temp }}/archive-data-sample
          IX_SAMPLE_PRINT: "1"
        run: |
          set -o pipefail
          go -C core-service test -race -timeout 50m -count=1 -run 'TestIx' -v ./internal/app/ 2>&1 | grep -E '^(=== RUN|--- |PASS|FAIL|ok|panic)|ix.*_test.go'
      - name: Keep the sample data export
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: archive-data-sample
          path: ${{ runner.temp }}/archive-data-sample
          if-no-files-found: ignore
